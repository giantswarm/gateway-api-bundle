{{- /*
App -> HelmRelease migration hooks.

Same approach as giantswarm/cluster's final App to HelmRelease migration. When
this chart stops rendering the sub-App CRs, helm deletes them and app-operator
deletes the matching Chart CRs in the workload cluster. Without protection,
chart-operator then uninstalls the Helm releases and Flux installs them anew.

- pre-upgrade: pause the bundle's Chart CRs in the workload cluster
  (`chart-operator.giantswarm.io/paused=true`). chart-operator skips paused
  Chart CRs entirely, deletion included, and keeps their finalizer. The hook
  fails if the pause cannot be applied, so helm never deletes the App CRs.
- post-upgrade: wait for app-operator to delete those Chart CRs and remove
  their finalizers, so they go away without chart-operator ever running
  `helm uninstall`. Flux adopts the existing Helm releases.

Both hooks are no-ops once no Chart CR of this bundle is left. Remove them (and
the .Values.migration block) once every cluster has migrated.
*/}}
{{- if .Values.migration.appToHelmRelease.enabled }}
{{- range $hook := list "pre-upgrade" "post-upgrade" }}
{{- $name := printf "%s-%s" $.Release.Name (eq $hook "pre-upgrade" | ternary "pause-charts" "release-charts") | trunc 63 | trimSuffix "-" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "labels.common" $ | nindent 4 }}
  annotations:
    helm.sh/hook: {{ $hook }}
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  activeDeadlineSeconds: {{ eq $hook "pre-upgrade" | ternary 120 360 }}
  backoffLimit: {{ eq $hook "pre-upgrade" | ternary 3 0 }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "labels.common" $ | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      volumes:
      - name: kubeconfig
        secret:
          secretName: {{ $.Values.clusterID }}-kubeconfig
          items:
          - key: value
            path: kubeconfig
      containers:
      - name: kubectl
        image: {{ $.Values.migration.appToHelmRelease.image }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: kubeconfig
          subPath: kubeconfig
          mountPath: /etc/kubeconfig
          readOnly: true
        env:
        - name: KUBECONFIG
          value: /etc/kubeconfig
        - name: SELECTOR
          value: {{ printf "app.kubernetes.io/instance=%s,giantswarm.io/cluster=%s" $.Release.Name $.Values.clusterID | quote }}
        command:
        - /bin/sh
        args:
        - -c
        - |
          set -o errexit -o nounset -o pipefail

          crd=$(kubectl get customresourcedefinitions.apiextensions.k8s.io charts.application.giantswarm.io --ignore-not-found --output name)
          if [ -z "${crd}" ]; then
            echo "✅ No Chart CRD in the workload cluster, nothing to do."
            exit 0
          fi

          list_charts() {
            kubectl get charts.application.giantswarm.io --namespace giantswarm --selector "${SELECTOR}" \
              --output jsonpath="{range .items[?($1)]}{.metadata.name}{'\n'}{end}"
          }
        {{- if eq $hook "pre-upgrade" }}

          charts=$(list_charts "@.metadata.name")
          if [ -z "${charts}" ]; then
            echo "✅ No Chart CRs match '${SELECTOR}', nothing to pause."
            exit 0
          fi

          echo "⏸️ Pausing Chart CRs so chart-operator does not uninstall them:" ${charts}
          kubectl annotate charts.application.giantswarm.io --namespace giantswarm ${charts} \
            chart-operator.giantswarm.io/paused=true --overwrite

          paused=$(list_charts "@.metadata.annotations.chart-operator\.giantswarm\.io/paused=='true'")
          if [ "${paused}" != "${charts}" ]; then
            echo "❌ Not all Chart CRs are paused. Expected:" ${charts} "Paused:" ${paused}
            exit 1
          fi
          echo "✅ All Chart CRs paused."
        {{- else }}

          deadline=$(( $(date +%s) + 300 ))
          while :; do
            terminating=$(list_charts "@.metadata.deletionTimestamp") || terminating=""
            if [ -n "${terminating}" ]; then
              echo "🧹 Removing finalizers from deleted Chart CRs:" ${terminating}
              kubectl patch charts.application.giantswarm.io --namespace giantswarm ${terminating} \
                --type merge --patch '{"metadata":{"finalizers":null}}' || :
            fi

            remaining=$(list_charts "@.metadata.name") || remaining="(unknown, listing failed)"
            if [ -z "${remaining}" ]; then
              echo "✅ No Chart CRs left."
              exit 0
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "⚠️ Chart CRs still present, left paused:" ${remaining}
              echo "⚠️ The next upgrade of this release retries the cleanup."
              exit 0
            fi
            sleep 10
          done
        {{- end }}
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi
{{- end }}
{{- end }}
