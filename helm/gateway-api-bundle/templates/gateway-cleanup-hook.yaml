{{- /*
pre-delete: uninstall gateway-api-config while envoy-gateway still runs.

Flux only honours dependsOn on install and upgrade. When the bundle is
uninstalled, helm deletes all HelmReleases at once, so envoy-gateway is often
gone before gateway-api-config. Envoy Gateway puts
gateway-exists-finalizer.gateway.networking.k8s.io on a GatewayClass that has
Gateways, and nothing else removes it: the gateway-api-config uninstall then
hangs and the Envoy proxies keep running.

This hook runs in the management cluster before helm deletes any HelmRelease
of the bundle. It deletes the gateway-api-config HelmRelease and waits until it
is gone, so Flux uninstalls the chart while Envoy Gateway can still remove its
proxies and the GatewayClass finalizer. It does not touch the workload cluster
itself.

It retries on API errors that can clear, stops early on errors that cannot (an
admission denial, a missing HelmRelease CRD), ends within timeoutSeconds and
always exits 0, so the bundle uninstall goes on even when gateway-api-config cannot be
uninstalled in time. That happens when a Gateway that gateway-api-config did not
create still uses its GatewayClass, or when the workload cluster is unreachable
while its kubeconfig secret still exists.

Known limits:
- The uninstall of the bundle waits for this hook. chart-operator, which
  uninstalls the bundle as an App, sets no timeout for it unless the App sets
  an uninstall timeout, and that must then be above timeoutSeconds + 60s.
- Like any pre-delete hook, a Job that cannot run (image pull, quota, a
  namespace that is already being deleted) fails the uninstall. To uninstall
  without it, set cleanup.gatewayApiConfig.enabled to false in the App's user
  values, let the App be upgraded, then delete it: hooks come from the
  installed release, not from the values at delete time. Without the hook the
  original hang can come back, and the GatewayClass finalizer then has to be
  removed by hand. Removing the finalizer of the App or Chart CR instead skips
  the uninstall entirely and leaves the HelmReleases running.
- Upgrades are not covered: disabling envoy-gateway and gateway-api-config in
  one upgrade can still hang the same way.
*/}}
{{- $cleanup := .Values.cleanup.gatewayApiConfig }}
{{- $config := .Values.apps.gatewayApiConfig }}
{{- if and $cleanup.enabled $config.enabled .Values.apps.envoyGateway.enabled }}
{{- $name := printf "%s-gateway-cleanup" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- $helmRelease := include "app.name" (dict "app" $config.appName "cluster" .Values.clusterID) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-1"
    # Helm only watches Jobs and Pods, so hook-failed never applies here. hook-succeeded removes
    # the RBAC after the Job, and since Helm 3.21 also when the Job fails.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
# Only the gateway-api-config HelmRelease of this cluster. kubectl delete and kubectl wait
# read it by name and watch it with a metadata.name field selector, which resourceNames allows.
- apiGroups:
  - helm.toolkit.fluxcd.io
  resources:
  - helmreleases
  resourceNames:
  - {{ $helmRelease }}
  verbs:
  - get
  - list
  - watch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "0"
    # A failed Job stays for debugging, ttlSecondsAfterFinished removes it.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  # The script ends within timeoutSeconds plus kubectl's 2s kill grace. The 60s on top
  # also count scheduling and pulling the image, and catch a pod that never finishes.
  activeDeadlineSeconds: {{ add $cleanup.timeoutSeconds 60 }}
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "labels.common" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      containers:
      - name: kubectl
        image: {{ $cleanup.image }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        env:
        # Writable HOME for kubectl's discovery cache.
        - name: HOME
          value: /tmp
        - name: HELMRELEASE
          value: {{ $helmRelease | quote }}
        - name: NAMESPACE
          value: {{ .Release.Namespace | quote }}
        - name: TIMEOUT
          value: {{ $cleanup.timeoutSeconds | quote }}
        command:
        - /bin/sh
        args:
        - -c
        - |
          set -o nounset

          HR="helmreleases.helm.toolkit.fluxcd.io/${HELMRELEASE}"
          ERR=/tmp/kubectl.err
          start=$(date +%s)
          end=$(( start + TIMEOUT ))
          # Retrying stops 10s before the end, so the final check keeps its own budget.
          retry_end=$(( end - 10 ))

          # Seconds until $1, at least 1 (`kubectl --timeout 0s` waits for a week), at most $2.
          upto() { r=$(( $1 - $(date +%s) )); [ "${r}" -ge 1 ] || r=1; [ "${r}" -le "$2" ] || r=$2; echo "${r}"; }
          elapsed() { echo $(( $(date +%s) - start )); }
          # busybox timeout kills kubectl at the deadline: --timeout only bounds the wait,
          # not the requests before it.
          kt() { t=$1; shift; timeout -k 2 "${t}" kubectl --namespace "${NAMESPACE}" "$@" 2>"${ERR}"; }
          # True only when a successful read finds no HelmRelease; a failed read is not "gone".
          gone() { out=$(kt "$(upto "${end}" "$1")" get "${HR}" --ignore-not-found --output name) && [ -z "${out}" ]; }
          # Errors that a retry cannot clear.
          permanent() { grep -qiE "denied the request|admission webhook|doesn't have a resource type|no matches for kind" "${ERR}" 2>/dev/null; }
          last_error() { [ -s "$1" ] && echo "⚠️ Last error: $(tail -n 1 "$1")"; }

          echo "🧹 Deleting ${HR} in ${NAMESPACE} and waiting for Flux to uninstall it."
          # Retry: an API error or an authorizer that does not see the new RoleBinding yet must
          # not skip the cleanup.
          deleted=""
          while [ "$(date +%s)" -lt "${retry_end}" ]; do
            if [ -z "${deleted}" ] && kt "$(upto "${retry_end}" 15)" delete "${HR}" --ignore-not-found --wait=false >/dev/null; then
              deleted=1
            fi
            if [ -n "${deleted}" ]; then
              t=$(upto "${retry_end}" "${TIMEOUT}")
              if kt "${t}" wait "${HR}" --for=delete --timeout "${t}s" >/dev/null; then
                echo "✅ ${HR} is gone after $(elapsed)s."
                exit 0
              fi
            fi
            permanent && break
            [ "$(date +%s)" -lt "${retry_end}" ] || break
            echo "⏳ Retrying."
            sleep "$(upto "${retry_end}" 5)"
          done

          # Keep the error of the retries; the final check below writes its own.
          cp "${ERR}" "${ERR}.retries" 2>/dev/null || : > "${ERR}.retries"
          if gone 8; then
            echo "✅ ${HR} is gone after $(elapsed)s."
            exit 0
          fi
          last_error "${ERR}.retries"
          echo "⚠️ ${HR} not gone after $(elapsed)s. Its conditions:"
          kt "$(upto "${end}" 5)" get "${HR}" --ignore-not-found \
            --output jsonpath='{range .status.conditions[*]}{.type}={.status} {.reason}: {.message}{"\n"}{end}' || :
          echo "⚠️ If the uninstall waits on the GatewayClass finalizer, a Gateway that gateway-api-config did not create may still use the class."
          echo "⚠️ Continuing the uninstall anyway."
          exit 0
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi
{{- end }}
