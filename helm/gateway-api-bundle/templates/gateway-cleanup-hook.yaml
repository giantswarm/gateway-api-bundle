{{- /*
pre-delete: remove the Gateways and GatewayClasses of gateway-api-config while
Envoy Gateway still runs.

Flux only honours dependsOn on install and upgrade. When the bundle is
uninstalled, helm deletes all HelmReleases at once, so envoy-gateway is often
gone before gateway-api-config. Envoy Gateway puts
gateway-exists-finalizer.gateway.networking.k8s.io on a GatewayClass that has
Gateways, and nothing else removes it: the gateway-api-config uninstall then
hangs and the Envoy proxies keep running.

This hook runs before helm deletes any HelmRelease:
1. It deletes the Gateways of gateway-api-config in its namespace.
2. It waits until Envoy Gateway has removed their proxies (Deployments,
   DaemonSets, Services, so their load balancers too).
3. It deletes the GatewayClasses of gateway-api-config, except a class that a
   Gateway gateway-api-config did not create still uses: that one is left.

It does not fail the uninstall on workload cluster conditions: API calls have a
request timeout, the run stays within timeoutSeconds, and it exits 0 when the
workload cluster cannot be reached, the Gateway API CRDs are missing, or
resources are still left at the deadline. The Job deadline fires before the
default 5m uninstall timeout, so a pod that never starts fails the hook instead
of hanging it.

Gateways it already deleted stay deleted if the uninstall then fails for another
reason. The child HelmReleases have no drift detection, so a bundle upgrade does
not bring them back unless gateway-api-config's version or values change:
`flux reconcile helmrelease <cluster>-gateway-api-config --force` reinstalls them.
*/}}
{{- $cleanup := .Values.cleanup.gatewayApiConfig }}
{{- $config := .Values.apps.gatewayApiConfig }}
{{- if and $cleanup.enabled $config.enabled .Values.apps.envoyGateway.enabled }}
{{- $name := printf "%s-gateway-cleanup" .Release.Name | trunc 63 | trimSuffix "-" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  # The script stops itself at timeoutSeconds; this only catches a hung pod, and fires
  # before the default 5m uninstall timeout (timeoutSeconds is at most 200).
  activeDeadlineSeconds: {{ add $cleanup.timeoutSeconds 60 }}
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "labels.common" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      volumes:
      - name: kubeconfig
        secret:
          secretName: {{ .Values.clusterID }}-kubeconfig
          optional: true
          items:
          - key: value
            path: kubeconfig
      containers:
      - name: kubectl
        image: {{ $cleanup.image }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: kubeconfig
          mountPath: /etc/kubeconfig-secret
          readOnly: true
        env:
        - name: KUBECONFIG
          value: /etc/kubeconfig-secret/kubeconfig
        - name: RELEASE
          value: {{ $config.appName | quote }}
        - name: NAMESPACE
          value: {{ $config.namespace | quote }}
        - name: TIMEOUT
          value: {{ $cleanup.timeoutSeconds | quote }}
        command:
        - /bin/sh
        args:
        - -c
        - |
          set -o nounset

          SELECTOR="giantswarm.io/managed-by=${RELEASE}"
          GATEWAYS=gateways.gateway.networking.k8s.io
          CLASSES=gatewayclasses.gateway.networking.k8s.io
          deadline=$(( $(date +%s) + TIMEOUT ))

          k() { kubectl --request-timeout=15s "$@"; }
          # Seconds left until the deadline, at least 1: `kubectl --timeout 0s` waits for a week.
          remaining() { r=$(( deadline - $(date +%s) )); [ "${r}" -ge 1 ] || r=1; echo "${r}"; }
          expired() { [ "$(date +%s)" -ge "${deadline}" ]; }
          done_ok() { echo "✅ $*"; exit 0; }
          give_up() { echo "⚠️ $*"; echo "⚠️ Continuing the uninstall anyway."; exit 0; }

          [ -s "${KUBECONFIG}" ] || done_ok "No workload cluster kubeconfig, nothing to clean up."
          k version >/dev/null 2>&1 || give_up "Workload cluster not reachable, skipping the Gateway cleanup."

          if ! crd=$(k get customresourcedefinitions.apiextensions.k8s.io "${CLASSES}" --ignore-not-found --output name); then
            give_up "Could not look up the Gateway API CRDs."
          fi
          [ -n "${crd}" ] || done_ok "No Gateway API CRDs in the workload cluster, nothing to clean up."

          if ! classes=$(k get "${CLASSES}" --selector "${SELECTOR}" --output jsonpath='{.items[*].metadata.name}'); then
            give_up "Could not list the GatewayClasses matching '${SELECTOR}'."
          fi
          if ! gateways=$(k get "${GATEWAYS}" --namespace "${NAMESPACE}" --selector "${SELECTOR}" --output jsonpath='{.items[*].metadata.name}'); then
            give_up "Could not list the Gateways matching '${SELECTOR}' in ${NAMESPACE}."
          fi
          # Gateways that gateway-api-config did not create but that use one of its GatewayClasses,
          # as "<class> <namespace>/<name>". While they exist, Envoy Gateway keeps that class's
          # finalizer (and its merged proxy), so only that class is left alone.
          foreign=""
          if [ -n "${classes}" ]; then
            if ! all=$(k get "${GATEWAYS}" --all-namespaces --output jsonpath='{range .items[*]}{.spec.gatewayClassName} {.metadata.namespace} {.metadata.name} {.metadata.labels.giantswarm\.io/managed-by}{"\n"}{end}'); then
              give_up "Could not list Gateways."
            fi
            foreign=$(echo "${all}" | awk -v classes=" ${classes} " -v ns="${NAMESPACE}" -v rel="${RELEASE}" \
              'NF >= 3 && index(classes, " " $1 " ") && !($2 == ns && $4 == rel) { print $1 " " $2 "/" $3 }')
          fi
          free_classes=""
          kept_classes=""
          for c in ${classes}; do
            if echo "${foreign}" | awk -v c="${c}" '$1 == c { found = 1 } END { exit !found }'; then
              kept_classes="${kept_classes} ${c}"
            else
              free_classes="${free_classes} ${c}"
            fi
          done

          # `delete --wait` runs without --request-timeout, which would also cut its watch;
          # --timeout bounds it.
          # 1. Gateways.
          if [ -n "${gateways}" ]; then
            echo "🧹 Deleting Gateways in ${NAMESPACE}:" ${gateways}
            kubectl delete "${GATEWAYS}" --namespace "${NAMESPACE}" ${gateways} --ignore-not-found --wait --timeout "$(remaining)s" \
              || give_up "Gateways not gone before the deadline."
          fi

          # 2. Their proxies. Envoy Gateway removes them asynchronously, in its own namespace or the
          # Gateway's, labelled with the owning Gateway, or with the GatewayClass when Gateways are merged.
          proxies_left=""
          wait_gone() {
            while :; do
              if left=$(k get deployments.apps,daemonsets.apps,services --all-namespaces --selector "$1" --output name); then
                [ -n "${left}" ] || return 0
              else
                left="(listing failed)"
              fi
              if expired; then
                proxies_left="${proxies_left} ${left}"
                return 0
              fi
              echo "⏳ Waiting for Envoy Gateway to remove the proxies:" ${left}
              sleep 5
            done
          }
          if [ -n "${gateways}" ]; then
            wait_gone "gateway.envoyproxy.io/owning-gateway-namespace=${NAMESPACE},gateway.envoyproxy.io/owning-gateway-name in ($(echo ${gateways} | tr ' ' ','))"
          fi
          if [ -n "${free_classes}" ]; then
            wait_gone "gateway.envoyproxy.io/owning-gatewayclass in ($(echo ${free_classes} | tr ' ' ','))"
          fi
          if [ -n "${proxies_left}" ]; then
            echo "⚠️ Envoy proxies still present at the deadline:" ${proxies_left}
          elif [ -n "${gateways}${free_classes}" ]; then
            echo "✅ Envoy proxies of ${RELEASE} removed."
          fi

          # 3. GatewayClasses that no Gateway from outside gateway-api-config uses.
          [ -n "${classes}" ] || done_ok "No GatewayClasses matching '${SELECTOR}'."
          if [ -n "${free_classes}" ]; then
            echo "🧹 Deleting GatewayClasses:" ${free_classes}
            kubectl delete "${CLASSES}" ${free_classes} --ignore-not-found --wait --timeout "$(remaining)s" \
              || give_up "GatewayClasses not gone before the deadline:" ${free_classes}
          fi
          if [ -n "${kept_classes}" ]; then
            foreign_gateways=$(echo "${foreign}" | awk '{ print $2 }')
            give_up "Leaving GatewayClasses" ${kept_classes}", Gateways not created by ${RELEASE} still use them." \
              "Delete them for the uninstall of ${RELEASE} to finish:" ${foreign_gateways}
          fi
          done_ok "Gateways and GatewayClasses of ${RELEASE} are gone."
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi
{{- end }}
