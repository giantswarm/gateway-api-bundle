{{- /*
pre-delete: uninstall gateway-api-config while envoy-gateway still runs.

Flux only honours dependsOn on install and upgrade. When the bundle is
uninstalled, helm deletes all HelmReleases at once, so envoy-gateway is often
gone before gateway-api-config. Envoy Gateway puts
gateway-exists-finalizer.gateway.networking.k8s.io on a GatewayClass that has
Gateways, and nothing else removes it: the gateway-api-config uninstall then
hangs and the Envoy proxies keep running.

This hook runs in the management cluster before helm deletes any HelmRelease
of the bundle. It deletes the gateway-api-config HelmRelease and waits until it
is gone, so Flux uninstalls the chart while Envoy Gateway can still remove its
proxies and the GatewayClass finalizer. It does not touch the workload cluster
itself.

It never waits longer than timeoutSeconds and always exits 0, so the bundle
uninstall goes on even when gateway-api-config cannot be uninstalled in time,
for example because a Gateway that gateway-api-config did not create still uses
its GatewayClass. The Job deadline fires before the default 5m uninstall
timeout, so a pod that never starts fails the hook instead of hanging it.
*/}}
{{- $cleanup := .Values.cleanup.gatewayApiConfig }}
{{- $config := .Values.apps.gatewayApiConfig }}
{{- if and $cleanup.enabled $config.enabled .Values.apps.envoyGateway.enabled }}
{{- $name := printf "%s-gateway-cleanup" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- $helmRelease := include "app.name" (dict "app" $config.appName "cluster" .Values.clusterID) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
# kubectl delete --wait reads and watches the object until it is gone.
- apiGroups:
  - helm.toolkit.fluxcd.io
  resources:
  - helmreleases
  verbs:
  - get
  - list
  - watch
# Only the gateway-api-config HelmRelease of this cluster can be deleted.
- apiGroups:
  - helm.toolkit.fluxcd.io
  resources:
  - helmreleases
  resourceNames:
  - {{ $helmRelease }}
  verbs:
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  # The script stops itself at timeoutSeconds; this only catches a pod that never
  # finishes, and fires before the default 5m uninstall timeout (timeoutSeconds is
  # at most 200).
  activeDeadlineSeconds: {{ add $cleanup.timeoutSeconds 60 }}
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "labels.common" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      containers:
      - name: kubectl
        image: {{ $cleanup.image }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        env:
        # Writable HOME for kubectl's discovery cache.
        - name: HOME
          value: /tmp
        - name: HELMRELEASE
          value: {{ $helmRelease | quote }}
        - name: NAMESPACE
          value: {{ .Release.Namespace | quote }}
        - name: TIMEOUT
          value: {{ $cleanup.timeoutSeconds | quote }}
        command:
        - /bin/sh
        args:
        - -c
        - |
          set -o nounset

          HR="helmreleases.helm.toolkit.fluxcd.io/${HELMRELEASE}"

          echo "🧹 Deleting ${HR} in ${NAMESPACE} and waiting for Flux to uninstall it."
          # busybox timeout kills kubectl at the deadline: --timeout only bounds the wait,
          # not the requests before it.
          if timeout -k 5 "${TIMEOUT}" kubectl delete "${HR}" --namespace "${NAMESPACE}" \
            --ignore-not-found --wait --timeout "${TIMEOUT}s"; then
            echo "✅ ${HR} is gone."
            exit 0
          fi

          echo "⚠️ ${HR} not gone after ${TIMEOUT}s. Its conditions:"
          timeout -k 2 15 kubectl get "${HR}" --namespace "${NAMESPACE}" --ignore-not-found \
            --output jsonpath='{range .status.conditions[*]}{.type}={.status} {.reason}: {.message}{"\n"}{end}' || :
          echo "⚠️ If the uninstall waits on the GatewayClass finalizer, a Gateway that gateway-api-config did not create may still use the class."
          echo "⚠️ Continuing the uninstall anyway."
          exit 0
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi
{{- end }}
