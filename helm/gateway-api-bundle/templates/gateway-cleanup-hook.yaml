{{- /*
pre-delete: uninstall gateway-api-config while envoy-gateway still runs.

Flux only honours dependsOn on install and upgrade. When the bundle is
uninstalled, helm deletes all HelmReleases at once, so envoy-gateway is often
gone before gateway-api-config. Envoy Gateway puts
gateway-exists-finalizer.gateway.networking.k8s.io on a GatewayClass that has
Gateways, and nothing else removes it: the gateway-api-config uninstall then
hangs and the Envoy proxies keep running.

This hook runs in the management cluster before helm deletes any HelmRelease
of the bundle. It deletes the gateway-api-config HelmRelease and waits until it
is gone, so Flux uninstalls the chart while Envoy Gateway can still remove its
proxies and the GatewayClass finalizer. It does not touch the workload cluster
itself.

It retries on API errors, never waits longer than timeoutSeconds and always
exits 0, so the bundle uninstall goes on even when gateway-api-config cannot be
uninstalled in time. That happens when a Gateway that gateway-api-config did not
create still uses its GatewayClass, or when the workload cluster is unreachable
while its kubeconfig secret still exists.

Known limits:
- The uninstall of the bundle waits for this hook. chart-operator, which
  uninstalls the bundle as an App, sets no timeout for it unless the App sets
  an uninstall timeout, and that must then be above timeoutSeconds + 60s.
- Like any pre-delete hook, a Job that cannot run (image pull, quota, a
  namespace that is already being deleted) fails the uninstall. To uninstall
  without it: `helm uninstall --no-hooks`, or remove the finalizer of the
  bundle's App/Chart CR.
- Upgrades are not covered: disabling envoy-gateway and gateway-api-config in
  one upgrade can still hang the same way.
*/}}
{{- $cleanup := .Values.cleanup.gatewayApiConfig }}
{{- $config := .Values.apps.gatewayApiConfig }}
{{- if and $cleanup.enabled $config.enabled .Values.apps.envoyGateway.enabled }}
{{- $name := printf "%s-gateway-cleanup" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- $helmRelease := include "app.name" (dict "app" $config.appName "cluster" .Values.clusterID) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-1"
    # hook-failed too: a ServiceAccount that can delete the HelmRelease must not stay behind.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
rules:
# Only the gateway-api-config HelmRelease of this cluster. kubectl delete and kubectl wait
# read it by name and watch it with a metadata.name field selector, which resourceNames allows.
- apiGroups:
  - helm.toolkit.fluxcd.io
  resources:
  - helmreleases
  resourceNames:
  - {{ $helmRelease }}
  verbs:
  - get
  - list
  - watch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "0"
    # A failed Job stays for debugging, ttlSecondsAfterFinished removes it.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  # The script stops itself at timeoutSeconds; this only catches a pod that never
  # finishes.
  activeDeadlineSeconds: {{ add $cleanup.timeoutSeconds 60 }}
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "labels.common" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      containers:
      - name: kubectl
        image: {{ $cleanup.image }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        env:
        # Writable HOME for kubectl's discovery cache.
        - name: HOME
          value: /tmp
        - name: HELMRELEASE
          value: {{ $helmRelease | quote }}
        - name: NAMESPACE
          value: {{ .Release.Namespace | quote }}
        - name: TIMEOUT
          value: {{ $cleanup.timeoutSeconds | quote }}
        command:
        - /bin/sh
        args:
        - -c
        - |
          set -o nounset

          HR="helmreleases.helm.toolkit.fluxcd.io/${HELMRELEASE}"
          start=$(date +%s)
          deadline=$(( start + TIMEOUT ))

          # Seconds left, at least 1 (`kubectl --timeout 0s` waits for a week), at most $1.
          left() { r=$(( deadline - $(date +%s) )); [ "${r}" -ge 1 ] || r=1; [ "${r}" -le "$1" ] || r=$1; echo "${r}"; }
          expired() { [ "$(date +%s)" -ge "${deadline}" ]; }
          # busybox timeout kills kubectl at the deadline: --timeout only bounds the wait,
          # not the requests before it.
          kt() { t=$1; shift; timeout -k 2 "${t}" kubectl --namespace "${NAMESPACE}" "$@"; }
          # True only when a successful read finds no HelmRelease; a failed read is not "gone".
          gone() { out=$(kt "$(left 15)" get "${HR}" --ignore-not-found --output name) && [ -z "${out}" ]; }

          echo "🧹 Deleting ${HR} in ${NAMESPACE} and waiting for Flux to uninstall it."
          # Retry until the deadline: an API error or an authorizer that does not see the new
          # RoleBinding yet must not skip the cleanup.
          while :; do
            if kt "$(left 15)" delete "${HR}" --ignore-not-found --wait=false >/dev/null; then
              t=$(left "${TIMEOUT}")
              if kt "${t}" wait "${HR}" --for=delete --timeout "${t}s" >/dev/null 2>&1 || gone; then
                echo "✅ ${HR} is gone after $(( $(date +%s) - start ))s."
                exit 0
              fi
            fi
            expired && break
            echo "⏳ Retrying."
            sleep "$(left 5)"
          done

          echo "⚠️ ${HR} not gone after $(( $(date +%s) - start ))s. Its conditions:"
          timeout -k 2 15 kubectl get "${HR}" --namespace "${NAMESPACE}" --ignore-not-found \
            --output jsonpath='{range .status.conditions[*]}{.type}={.status} {.reason}: {.message}{"\n"}{end}' || :
          echo "⚠️ If the uninstall waits on the GatewayClass finalizer, a Gateway that gateway-api-config did not create may still use the class."
          echo "⚠️ Continuing the uninstall anyway."
          exit 0
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi
{{- end }}
