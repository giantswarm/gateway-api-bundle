suite: gateway-api-state-metrics app
templates:
  - templates/helmreleases.yaml
release:
  name: gateway-api-bundle
  namespace: org-test
# Only the CRDs and the state-metrics app, so the documents have fixed indexes:
# 0 and 1 are the CRDs OCIRepository and HelmRelease, 2 to 4 the state-metrics
# OCIRepository, HelmRelease and default values ConfigMap.
set:
  clusterID: test
  apps.envoyGateway.enabled: false
  apps.gatewayApiConfig.enabled: false
tests:
  - it: pulls kube-state-metrics-app from gsoci
    documentIndex: 2
    asserts:
      - isKind:
          of: OCIRepository
      - equal:
          path: spec.url
          value: oci://gsoci.azurecr.io/charts/giantswarm/kube-state-metrics

  - it: installs it into envoy-gateway-system after the CRDs
    documentIndex: 3
    asserts:
      - isKind:
          of: HelmRelease
      - equal:
          path: metadata.name
          value: test-gateway-api-state-metrics
      - equal:
          path: spec.releaseName
          value: gateway-api-state-metrics
      - equal:
          path: spec.targetNamespace
          value: envoy-gateway-system
      - contains:
          path: spec.dependsOn
          content:
            name: test-gateway-api-crds
            namespace: org-test
      # The defaults from valuesFile come first, so cluster and user values win.
      - equal:
          path: spec.valuesFrom[0]
          value:
            kind: ConfigMap
            name: test-gateway-api-state-metrics-default-values
            valuesKey: values
            optional: false

  - it: exports only the HTTPRoute backends
    documentIndex: 4
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-gateway-api-state-metrics-default-values
      - matchRegex:
          path: data.values
          pattern: '--custom-resource-state-only=true'
      - matchRegex:
          path: data.values
          pattern: 'collectors: \[\]'
      - matchRegex:
          path: data.values
          pattern: 'metricNamePrefix: gatewayapi_httproute'
      - matchRegex:
          path: data.values
          pattern: 'backend2_name: \[backendRefs, "2", name\]'
      - matchRegex:
          path: data.values
          pattern: 'resources: \["httproutes"\]'
      - matchRegex:
          path: data.values
          pattern: 'application.giantswarm.io/team: cabbage'
      # Keeps the series apart from the kube-state-metrics of observability-bundle,
      # which has job="kube-state-metrics".
      - matchRegex:
          path: data.values
          pattern: 'jobLabel: app.kubernetes.io/instance'
      - matchRegex:
          path: data.values
          pattern: 'selfMonitor:\s+enabled: false'

  - it: renders nothing for the app when disabled
    set:
      apps.gatewayApiStateMetrics.enabled: false
    asserts:
      - hasDocuments:
          count: 2

  - it: puts user values after the defaults
    set:
      apps.gatewayApiStateMetrics.userConfig.configMap.values:
        kube-state-metrics:
          replicas: 2
    documentIndex: 3
    asserts:
      - equal:
          path: spec.valuesFrom[0].name
          value: test-gateway-api-state-metrics-default-values
      - equal:
          path: spec.valuesFrom[2].name
          value: test-gateway-api-state-metrics-user-values

  - it: fails when the valuesFile is missing from the chart
    set:
      apps.gatewayApiStateMetrics.valuesFile: files/missing.yaml
    asserts:
      - failedTemplate:
          errorPattern: 'valuesFile "files/missing.yaml" of app "test-gateway-api-state-metrics" is missing or empty'
