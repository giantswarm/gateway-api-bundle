suite: gateway cleanup pre-delete hook
templates:
  - templates/gateway-cleanup-hook.yaml
release:
  name: test-gateway-api-bundle
  namespace: org-test
set:
  clusterID: test
tests:
  - it: renders a ServiceAccount, Role, RoleBinding and Job as pre-delete hooks
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-delete
      - equal:
          path: metadata.name
          value: test-gateway-api-bundle-gateway-cleanup
      - equal:
          path: metadata.namespace
          value: org-test

  - it: creates the ServiceAccount before the Job and removes it even when the hook fails
    documentSelector:
      path: kind
      value: ServiceAccount
    asserts: &rbacHook
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-1"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded,hook-failed

  - it: creates the Role before the Job and removes it even when the hook fails
    documentSelector:
      path: kind
      value: Role
    asserts: *rbacHook

  - it: creates the RoleBinding before the Job and removes it even when the hook fails
    documentSelector:
      path: kind
      value: RoleBinding
    asserts: *rbacHook

  - it: runs the Job after the RBAC and keeps it when it fails
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "0"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded

  - it: only gives the hook access to the gateway-api-config HelmRelease of the cluster
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups:
                - helm.toolkit.fluxcd.io
              resources:
                - helmreleases
              resourceNames:
                - test-gateway-api-config
              verbs:
                - get
                - list
                - watch
                - delete

  - it: runs the Job as the hook ServiceAccount against that HelmRelease
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: test-gateway-api-bundle-gateway-cleanup
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HELMRELEASE
            value: test-gateway-api-config
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NAMESPACE
            value: org-test
      - matchRegex:
          path: spec.template.spec.containers[0].args[1]
          pattern: timeout -k 2 "\$\{t\}" kubectl
      - matchRegex:
          path: spec.template.spec.containers[0].args[1]
          pattern: delete "\$\{HR\}" --ignore-not-found --wait=false
      - matchRegex:
          path: spec.template.spec.containers[0].args[1]
          pattern: wait "\$\{HR\}" --for=delete
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[1]
          pattern: exit [1-9]

  - it: follows a renamed gateway-api-config app
    set:
      apps.gatewayApiConfig.appName: my-gateways
    asserts:
      - contains:
          path: rules[0].resourceNames
          content: test-my-gateways
        documentSelector:
          path: kind
          value: Role
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HELMRELEASE
            value: test-my-gateways
        documentSelector:
          path: kind
          value: Job

  - it: stops itself at timeoutSeconds, the Job deadline is only a backstop
    set:
      cleanup.gatewayApiConfig.timeoutSeconds: 60
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TIMEOUT
            value: "60"
      - equal:
          path: spec.activeDeadlineSeconds
          value: 120

  - it: ends before the default 5m uninstall timeout at the largest timeoutSeconds
    set:
      cleanup.gatewayApiConfig.timeoutSeconds: 200
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.activeDeadlineSeconds
          value: 260

  - it: rejects a timeoutSeconds above 200
    set:
      cleanup.gatewayApiConfig.timeoutSeconds: 201
    asserts:
      - failedTemplate:
          errorPattern: "timeoutSeconds.*(201|200)"

  - it: rejects a timeoutSeconds below 30
    set:
      cleanup.gatewayApiConfig.timeoutSeconds: 29
    asserts:
      - failedTemplate:
          errorPattern: "timeoutSeconds.*(29|30)"

  - it: truncates the resource names to 63 characters
    release:
      name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^.{1,63}$

  - it: is not rendered when disabled
    set:
      cleanup.gatewayApiConfig.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: is not rendered without gateway-api-config
    set:
      apps.gatewayApiConfig.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: is not rendered without envoy-gateway
    set:
      apps.envoyGateway.enabled: false
    asserts:
      - hasDocuments:
          count: 0
