clusterID: "test"
organization: ""

# Migration machinery for the App -> Flux HelmRelease transition.
# On existing clusters the sub-apps are still managed by chart-operator via App/Chart CRs.
# When this chart stops rendering the App CRs (they were replaced by HelmReleases), helm
# would delete them and chart-operator would uninstall the running workloads. The pre-upgrade
# hook below cordons those App CRs first so chart-operator leaves the underlying Helm releases
# in place, allowing Flux to adopt them instead of reinstalling.
# This hook is only needed while clusters are migrating; it can be disabled and removed once
# every cluster has gone through a release containing it.
migration:
  appToHelmRelease:
    enabled: true
    # Image must provide a shell and kubectl. Defaults to the same image the tested
    # cluster-chart migration hook (giantswarm/cluster#780) uses.
    image: gsoci.azurecr.io/giantswarm/marctl:v4.24.2
    # How long to keep the App CRs cordoned. Far-future date, matching the cluster chart.
    cordonUntil: "2030-01-01"

apps:
  gatewayApiCrds:
    appName: gateway-api-crds
    chartName: gateway-api-crds
    catalog: giantswarm
    enabled: true
    namespace: kube-system
    # used by renovate
    # repo: giantswarm/gateway-api-crds-app
    version: 1.9.1
    # User values can be provided via a ConfigMap or Secret for each individual app
    userConfig: {}
    # a list of extraConfigs for the App,
    # It can be secret or configmap
    # https://github.com/giantswarm/rfc/tree/main/multi-layer-app-config#example
    extraConfigs: []
  envoyGateway:
    appName: envoy-gateway
    chartName: envoy-gateway
    catalog: giantswarm
    dependsOn:
      - gateway-api-crds
    enabled: true
    namespace: envoy-gateway-system
    # used by renovate
    # repo: giantswarm/envoy-gateway-app
    version: 1.10.0
    # User values can be provided via a ConfigMap or Secret for each individual app
    userConfig: {}
    # a list of extraConfigs for the App,
    # It can be secret or configmap
    # https://github.com/giantswarm/rfc/tree/main/multi-layer-app-config#example
    extraConfigs: []
  gatewayApiConfig:
    appName: gateway-api-config
    chartName: gateway-api-config
    catalog: giantswarm
    dependsOn:
      - envoy-gateway
    enabled: true
    namespace: envoy-gateway-system
    # used by renovate
    # repo: giantswarm/gateway-api-config-app
    version: 1.11.1
    # User values can be provided via a ConfigMap or Secret for each individual app
    userConfig: {}
    # a list of extraConfigs for the App,
    # It can be secret or configmap
    # https://github.com/giantswarm/rfc/tree/main/multi-layer-app-config#example
    extraConfigs: []
  envoyAIGateway:
    appName: envoy-ai-gateway
    chartName: envoy-ai-gateway
    catalog: giantswarm
    dependsOn:
      - gateway-api-crds
    enabled: false
    namespace: envoy-ai-gateway-system
    # used by renovate
    # repo: giantswarm/envoy-ai-gateway-app
    version: 0.1.1
    # User values can be provided via a ConfigMap or Secret for each individual app
    userConfig: {}
    # a list of extraConfigs for the App,
    # It can be secret or configmap
    # https://github.com/giantswarm/rfc/tree/main/multi-layer-app-config#example
    extraConfigs: []
  cloudwatchExporter:
    appName: cloudwatch-exporter
    chartName: cloudwatch-exporter
    catalog: giantswarm
    enabled: false
    namespace: envoy-gateway-system
    # used by renovate
    # repo: giantswarm/cloudwatch-exporter-app
    version: 0.0.3
    # Rendered against the release context via tpl; requires the aws.* values below.
    userConfig:
      configMap:
        values:
          clusterID: "{{ .Values.clusterID }}"
          region: "{{ .Values.aws.region }}"
          serviceAccount:
            create: true
            name: yace
            annotations:
              eks.amazonaws.com/role-arn: "{{ .Values.clusterID }}-cloudwatch-exporter"
    extraConfigs: []

# AWS context used to build IRSA trust policies for iamRoles (management-cluster side).
aws:
  accountID: ""
  # IRSA OIDC provider host is built as irsa.<clusterID>.<baseDomain>
  baseDomain: ""
  region: ""

# IAM roles provisioned on the management cluster via Crossplane (iam.aws.upbound.io).
# Each role gets an IRSA trust policy for its service account on the workload cluster.
# Full role name = <clusterID>-cloudwatch-exporter.
iamRoles:
  cloudwatchExporter:
    enabled: false
    # Service account (namespace/name) on the workload cluster allowed to assume the role.
    namespace: envoy-gateway-system
    serviceAccount: yace
