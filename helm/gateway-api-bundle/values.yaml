clusterID: "test"
organization: ""

# App -> Flux HelmRelease migration hooks. They pause the bundle's Chart CRs in the workload
# cluster before helm deletes the App CRs, then remove the Chart CRs' finalizers, so chart-operator
# never uninstalls the running workloads and Flux adopts the existing Helm releases.
migration:
  appToHelmRelease:
    enabled: true
    image: gsoci.azurecr.io/giantswarm/docker-kubectl:1.37.2

apps:
  gatewayApiCrds:
    appName: gateway-api-crds
    chartName: gateway-api-crds
    catalog: giantswarm
    enabled: true
    namespace: kube-system
    # used by renovate
    # repo: giantswarm/gateway-api-crds-app
    version: 1.9.1
    # User values can be provided via a ConfigMap or Secret for each individual app
    userConfig: {}
    # a list of extraConfigs for the App,
    # It can be secret or configmap
    # https://github.com/giantswarm/rfc/tree/main/multi-layer-app-config#example
    extraConfigs: []
  envoyGateway:
    appName: envoy-gateway
    chartName: envoy-gateway
    catalog: giantswarm
    dependsOn:
      - gateway-api-crds
    enabled: true
    namespace: envoy-gateway-system
    # used by renovate
    # repo: giantswarm/envoy-gateway-app
    version: 1.10.5
    # User values can be provided via a ConfigMap or Secret for each individual app
    userConfig: {}
    # a list of extraConfigs for the App,
    # It can be secret or configmap
    # https://github.com/giantswarm/rfc/tree/main/multi-layer-app-config#example
    extraConfigs: []
  gatewayApiConfig:
    appName: gateway-api-config
    chartName: gateway-api-config
    catalog: giantswarm
    dependsOn:
      - envoy-gateway
    enabled: true
    namespace: envoy-gateway-system
    # used by renovate
    # repo: giantswarm/gateway-api-config-app
    version: 1.13.1
    # User values can be provided via a ConfigMap or Secret for each individual app
    userConfig: {}
    # a list of extraConfigs for the App,
    # It can be secret or configmap
    # https://github.com/giantswarm/rfc/tree/main/multi-layer-app-config#example
    extraConfigs: []
  gatewayApiStateMetrics:
    appName: gateway-api-state-metrics
    chartName: kube-state-metrics
    catalog: giantswarm
    dependsOn:
      - gateway-api-crds
    enabled: true
    namespace: envoy-gateway-system
    # used by renovate
    # repo: giantswarm/kube-state-metrics-app
    version: 0.0.0-r4c02ffect20261110222230hd17d4a1
    # A kube-state-metrics instance for the Gateway API resources. It only exports custom
    # resources; the kube-state-metrics of observability-bundle covers everything else.
    # The config lives here, so it changes together with the Gateway API CRDs of the bundle.
    userConfig:
      configMap:
        values:
          kube-state-metrics:
            fullnameOverride: gateway-api-state-metrics
            collectors: []
            metricLabelsAllowlist: []
            extraArgs:
              - --custom-resource-state-only=true
            # Routes the metrics to Mimir and names the owner.
            customLabels:
              application.giantswarm.io/team: cabbage
            rbac:
              extraRules:
                - apiGroups: ["gateway.networking.k8s.io"]
                  resources: ["httproutes"]
                  verbs: ["list", "watch"]
            prometheus:
              monitor:
                # job="gateway-api-state-metrics", so alerts and dashboards for the
                # kube-state-metrics of observability-bundle (job="kube-state-metrics")
                # do not pick up this instance.
                jobLabel: app.kubernetes.io/instance
                http:
                  # Keeps the namespace of the exported resource instead of renaming it
                  # to exported_namespace in favour of the pod's namespace.
                  honorLabels: true
                  # The defaults of kube-state-metrics-app only apply to the built-in
                  # collectors, which this instance does not run.
                  metricRelabelings: []
                  relabelings: []
            customResourceState:
              enabled: true
              config:
                kind: CustomResourceStateMetrics
                spec:
                  resources:
                    # HTTPRoute backends. KSM cannot iterate a list inside a list, so
                    # spec.rules[*].backendRefs[*] is read by fixed index: one series per
                    # rule, with its first three backends as labels. Labels of a backend
                    # that does not exist are left out. The rule name and first path match
                    # keep most rules with the same backends apart. A backend without a
                    # namespace label is in the namespace of the route.
                    - groupVersionKind:
                        group: gateway.networking.k8s.io
                        kind: HTTPRoute
                        version: v1
                      metricNamePrefix: gatewayapi_httproute
                      labelsFromPath:
                        name: [metadata, name]
                        namespace: [metadata, namespace]
                      metrics:
                        - name: rule_backend_info
                          help: "First three backendRefs of each HTTPRoute rule"
                          each:
                            type: Info
                            info:
                              path: [spec, rules]
                              labelsFromPath:
                                rule_name: [name]
                                match_path_type: [matches, "0", path, type]
                                match_path: [matches, "0", path, value]
                                backend0_kind: [backendRefs, "0", kind]
                                backend0_namespace: [backendRefs, "0", namespace]
                                backend0_name: [backendRefs, "0", name]
                                backend0_port: [backendRefs, "0", port]
                                backend0_weight: [backendRefs, "0", weight]
                                backend1_kind: [backendRefs, "1", kind]
                                backend1_namespace: [backendRefs, "1", namespace]
                                backend1_name: [backendRefs, "1", name]
                                backend1_port: [backendRefs, "1", port]
                                backend1_weight: [backendRefs, "1", weight]
                                backend2_kind: [backendRefs, "2", kind]
                                backend2_namespace: [backendRefs, "2", namespace]
                                backend2_name: [backendRefs, "2", name]
                                backend2_port: [backendRefs, "2", port]
                                backend2_weight: [backendRefs, "2", weight]
    extraConfigs: []
  cloudwatchExporter:
    appName: cloudwatch-exporter
    chartName: cloudwatch-exporter
    catalog: giantswarm
    enabled: false
    namespace: envoy-gateway-system
    # used by renovate
    # repo: giantswarm/cloudwatch-exporter-app
    version: 0.0.11
    # Rendered against the release context via tpl; resolves the aws.* values below.
    userConfig:
      configMap:
        values:
          clusterID: "{{ .Values.clusterID }}"
          region: '{{ include "aws.region" . }}'
          serviceAccount:
            create: true
            name: yace
            annotations:
              eks.amazonaws.com/role-arn: "{{ .Values.clusterID }}-cloudwatch-exporter"
    extraConfigs: []

# AWS context used to build IRSA trust policies for iamRoles (management-cluster side).
# All values are optional overrides. When left empty they are read from the
# <clusterID>-crossplane-config ConfigMap in the release namespace.
aws:
  accountID: ""
  # IRSA OIDC provider host, used verbatim.
  oidcDomain: ""
  # Legacy fallback, only used when oidcDomain resolves to nothing.
  # The OIDC provider host is then built as irsa.<clusterID>.<baseDomain>
  baseDomain: ""
  region: ""

# IAM roles provisioned on the management cluster via Crossplane (iam.aws.upbound.io).
# Each role gets an IRSA trust policy for its service account on the workload cluster.
# Full role name = <clusterID>-cloudwatch-exporter.
iamRoles:
  cloudwatchExporter:
    # The role is created when apps.cloudwatchExporter is enabled. Set to false to skip it.
    enabled: true
    # Service account (namespace/name) on the workload cluster allowed to assume the role.
    namespace: envoy-gateway-system
    serviceAccount: yace
