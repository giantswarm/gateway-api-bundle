clusterID: "test"
organization: ""

# App -> Flux HelmRelease migration hooks. They pause the bundle's Chart CRs in the workload
# cluster before helm deletes the App CRs, then remove the Chart CRs' finalizers, so chart-operator
# never uninstalls the running workloads and Flux adopts the existing Helm releases.
migration:
  appToHelmRelease:
    enabled: true
    image: gsoci.azurecr.io/giantswarm/docker-kubectl:1.37.2

# pre-delete hook: when the bundle is uninstalled, delete the gateway-api-config HelmRelease in this
# namespace and wait for Flux to uninstall it while Envoy Gateway still runs. Otherwise envoy-gateway
# can be uninstalled first, the GatewayClass keeps its gateway-exists finalizer and the uninstall hangs.
# The hook waits as long as the gateway-api-config HelmRelease's own timeout (apps.gatewayApiConfig.timeout,
# 10m by default) and fails the bundle uninstall when it is reached, so envoy-gateway stays.
# The bundle HelmRelease needs an uninstall timeout of at least that plus 2m (12m by default),
# see templates/gateway-cleanup-hook.yaml.
cleanup:
  gatewayApiConfig:
    enabled: true
    image: gsoci.azurecr.io/giantswarm/docker-kubectl:1.37.2

apps:  # @schema additionalProperties: true
  gatewayApiCrds:  # @schema $ref: schemas/app.json; skipProperties: true
    appName: gateway-api-crds
    chartName: gateway-api-crds
    catalog: giantswarm
    enabled: true
    namespace: kube-system
    # used by renovate
    # repo: giantswarm/gateway-api-crds-app
    version: 1.9.1
    # User values can be provided via a ConfigMap or Secret for each individual app
    userConfig: {}
    # a list of extraConfigs for the App,
    # It can be secret or configmap
    # https://github.com/giantswarm/rfc/tree/main/multi-layer-app-config#example
    extraConfigs: []
  envoyGateway:  # @schema $ref: schemas/app.json; skipProperties: true
    appName: envoy-gateway
    chartName: envoy-gateway
    catalog: giantswarm
    dependsOn:
      - gateway-api-crds
    enabled: true
    namespace: envoy-gateway-system
    # used by renovate
    # repo: giantswarm/envoy-gateway-app
    version: 1.10.5
    # User values can be provided via a ConfigMap or Secret for each individual app
    userConfig: {}
    # a list of extraConfigs for the App,
    # It can be secret or configmap
    # https://github.com/giantswarm/rfc/tree/main/multi-layer-app-config#example
    extraConfigs: []
  gatewayApiConfig:  # @schema $ref: schemas/app.json; skipProperties: true
    appName: gateway-api-config
    chartName: gateway-api-config
    catalog: giantswarm
    dependsOn:
      - envoy-gateway
    enabled: true
    namespace: envoy-gateway-system
    # used by renovate
    # repo: giantswarm/gateway-api-config-app
    version: 1.13.1
    # User values can be provided via a ConfigMap or Secret for each individual app
    userConfig: {}
    # a list of extraConfigs for the App,
    # It can be secret or configmap
    # https://github.com/giantswarm/rfc/tree/main/multi-layer-app-config#example
    extraConfigs: []
  gatewayApiStateMetrics:  # @schema $ref: schemas/app.json; skipProperties: true
    appName: gateway-api-state-metrics
    chartName: kube-state-metrics
    catalog: giantswarm
    dependsOn:
      - gateway-api-crds
    enabled: true
    namespace: envoy-gateway-system
    # used by renovate
    # repo: giantswarm/kube-state-metrics-app
    version: 0.1.0
    # valuesFile: a values file in this chart, passed to the HelmRelease before the cluster
    # and user values. It is used as is, not templated. The kube-state-metrics config of
    # this app is there.
    valuesFile: files/gateway-api-state-metrics/values.yaml
    userConfig: {}
    extraConfigs: []
  cloudwatchExporter:  # @schema $ref: schemas/app.json; skipProperties: true
    appName: cloudwatch-exporter
    chartName: cloudwatch-exporter
    catalog: giantswarm
    enabled: false
    namespace: envoy-gateway-system
    # used by renovate
    # repo: giantswarm/cloudwatch-exporter-app
    version: 0.1.4
    # Rendered against the release context via tpl; resolves the aws.* values below.
    userConfig:
      configMap:
        values:
          clusterID: "{{ .Values.clusterID }}"
          region: '{{ include "aws.region" . }}'
          serviceAccount:
            create: true
            name: yace
            annotations:
              eks.amazonaws.com/role-arn: "{{ .Values.clusterID }}-cloudwatch-exporter"
    extraConfigs: []

# AWS context used to build IRSA trust policies for iamRoles (management-cluster side).
# All values are optional overrides. When left empty they are read from the
# <clusterID>-crossplane-config ConfigMap in the release namespace.
aws:
  accountID: ""
  # IRSA OIDC provider host, used verbatim.
  oidcDomain: ""
  # Legacy fallback, only used when oidcDomain resolves to nothing.
  # The OIDC provider host is then built as irsa.<clusterID>.<baseDomain>
  baseDomain: ""
  region: ""

# IAM roles provisioned on the management cluster via Crossplane (iam.aws.upbound.io).
# Each role gets an IRSA trust policy for its service account on the workload cluster.
# Full role name = <clusterID>-cloudwatch-exporter.
iamRoles:
  cloudwatchExporter:
    # The role is created when apps.cloudwatchExporter is enabled. Set to false to skip it.
    enabled: true
    # Service account (namespace/name) on the workload cluster allowed to assume the role.
    namespace: envoy-gateway-system
    serviceAccount: yace
