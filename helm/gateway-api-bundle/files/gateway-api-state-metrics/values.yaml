# Default values of the gateway-api-state-metrics app: a kube-state-metrics instance for
# the Gateway API resources. It only exports custom resources; the kube-state-metrics of
# observability-bundle covers everything else. The config lives in the bundle, so it
# changes together with the Gateway API CRDs. The bundle renders this file into the
# <cluster>-gateway-api-state-metrics-default-values ConfigMap; cluster and user values
# are merged on top of it.
kube-state-metrics:
  fullnameOverride: gateway-api-state-metrics
  collectors: []
  metricLabelsAllowlist: []
  extraArgs:
    - --custom-resource-state-only=true
  # The telemetry endpoint is not scraped; only port 8080 is open.
  selfMonitor:
    enabled: false
  # Routes the metrics to Mimir and names the owner.
  customLabels:
    application.giantswarm.io/team: cabbage
  # The defaults of kube-state-metrics-app are sized for all built-in collectors.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  verticalPodAutoscaler:
    minAllowed:
      cpu: 10m
      memory: 64Mi
  networkPolicy:
    # Only the metrics port is scraped; the kubelet reaches the probes as
    # host traffic. Egress to the API server comes from the chart defaults.
    ingress:
      - ports:
          - port: 8080
            protocol: TCP
  rbac:
    extraRules:
      - apiGroups: ["gateway.networking.k8s.io"]
        resources: ["httproutes"]
        verbs: ["list", "watch"]
  prometheus:
    monitor:
      # job="gateway-api-state-metrics", so alerts and dashboards for the
      # kube-state-metrics of observability-bundle (job="kube-state-metrics")
      # do not pick up this instance.
      jobLabel: app.kubernetes.io/instance
      http:
        # Keeps the namespace of the exported resource instead of renaming it
        # to exported_namespace in favour of the pod's namespace.
        honorLabels: true
        # The defaults of kube-state-metrics-app only apply to the built-in
        # collectors, which this instance does not run.
        metricRelabelings: []
        relabelings: []
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          # HTTPRoute backends. KSM cannot iterate a list inside a list, so
          # spec.rules[*].backendRefs[*] is read by fixed index: one series per
          # rule, with its first three backends as labels. Labels of a backend
          # that does not exist are left out. The rule name and first path match
          # keep most rules with the same backends apart. A backend without a
          # namespace label is in the namespace of the route.
          - groupVersionKind:
              group: gateway.networking.k8s.io
              kind: HTTPRoute
              version: v1
            metricNamePrefix: gatewayapi_httproute
            labelsFromPath:
              name: [metadata, name]
              namespace: [metadata, namespace]
            metrics:
              - name: rule_backend_info
                help: "First three backendRefs of each HTTPRoute rule"
                each:
                  type: Info
                  info:
                    path: [spec, rules]
                    labelsFromPath:
                      rule_name: [name]
                      match_path_type: [matches, "0", path, type]
                      match_path: [matches, "0", path, value]
                      backend0_kind: [backendRefs, "0", kind]
                      backend0_namespace: [backendRefs, "0", namespace]
                      backend0_name: [backendRefs, "0", name]
                      backend0_port: [backendRefs, "0", port]
                      backend0_weight: [backendRefs, "0", weight]
                      backend1_kind: [backendRefs, "1", kind]
                      backend1_namespace: [backendRefs, "1", namespace]
                      backend1_name: [backendRefs, "1", name]
                      backend1_port: [backendRefs, "1", port]
                      backend1_weight: [backendRefs, "1", weight]
                      backend2_kind: [backendRefs, "2", kind]
                      backend2_namespace: [backendRefs, "2", namespace]
                      backend2_name: [backendRefs, "2", name]
                      backend2_port: [backendRefs, "2", port]
                      backend2_weight: [backendRefs, "2", weight]
